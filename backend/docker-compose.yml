version: '3.8'

# ==============================================================================
# INTELLIGENT PHISHING, WEB SECURITY, PKI VALIDATION & CTI PLATFORM
# Local E2E Multi-Service Docker Compose Orchestration
# ==============================================================================

services:
  # ============================================================================
  # 1. DATA LAYER: Kafka Broker (KRaft Mode)
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: trustshield-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # Internal Docker listener
      - "9094:9094"   # Host direct listener
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://localhost:9094'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - trustshield-backend-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # Kafka UI for Real-Time Event & Topic Observability
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: trustshield-kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: trustshield-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - trustshield-backend-net

  # ============================================================================
  # 2. DATA LAYER: PostgreSQL 16 with pgvector Extension
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trustshield-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trustshield}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - trustshield-backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustshield"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 3. DATA LAYER: Redis Stack (Bloom & Cuckoo Filters, L1 Cache)
  # ============================================================================
  redis:
    image: redis/redis-stack-server:7.2.0-v10
    container_name: trustshield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:-redis_secure_pass} --maxmemory 512mb --maxmemory-policy allkeys-lru"
    volumes:
      - redisdata:/data
    networks:
      - trustshield-backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secure_pass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 4. DATA LAYER: Neo4j Graph Database (STIX 2.1 Threat Graph)
  # ============================================================================
  neo4j:
    image: neo4j:5.20-community
    container_name: trustshield-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP Browser UI
      - "7687:7687"   # Bolt Protocol
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4j_secure_pass}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
      NEO4J_dbms_security_procedures_allowlist: 'apoc.*'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1024m
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4jdata:/data
      - neo4jplugins:/plugins
      - ./scripts/init-neo4j.cypher:/docker-entrypoint-initdb.d/init-neo4j.cypher:ro
    networks:
      - trustshield-backend-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # ============================================================================
  # 5. DATA LAYER: MinIO S3-Compatible Encrypted Artifact Vault
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: trustshield-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secure}
    volumes:
      - miniodata:/data
    networks:
      - trustshield-backend-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 6. APPLICATION LAYER: Go API Gateway & Dual-Lane Router
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: trustshield-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ENVIRONMENT: development
      CORS_ALLOWED_ORIGINS: "*"
      DATABASE_URL: postgresql://postgres:postgres_secure_pass@postgres:5432/trustshield?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_secure_pass
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_SCAN_TASKS: trustshield.scan.tasks
      KAFKA_TOPIC_SCAN_TELEMETRY: trustshield.scan.telemetry
      KAFKA_TOPIC_SCAN_RESULTS: trustshield.scan.results
      SCANNER_MAX_BODY_BYTES: 10485760
      SCANNER_MAX_REDIRECT_HOPS: 5
      SCANNER_DETONATION_TIMEOUT_SEC: 15
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trustshield-backend-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 7. WORKER POOLS: Pillar 1 Phishing Detonation & Vision Worker
  # ============================================================================
  worker-pillar1-phishing:
    build:
      context: .
      dockerfile: workers/pillar1-phishing/Dockerfile
    container_name: trustshield-worker-pillar1
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_PILLAR1_PHISHING: trustshield.pillar1.phishing
      DATABASE_URL: postgresql://postgres:postgres_secure_pass@postgres:5432/trustshield?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin_secure
      S3_BUCKET: trustshield-artifacts
      SCANNER_DETONATION_TIMEOUT_SEC: 15
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - trustshield-backend-net
      - trustshield-isolated-egress

  # ============================================================================
  # 8. WORKER POOLS: Pillar 2 Cryptographic Trust & PKI Worker
  # ============================================================================
  worker-pillar2-pki:
    build:
      context: .
      dockerfile: workers/pillar2-pki/Dockerfile
    container_name: trustshield-worker-pillar2
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_PILLAR2_PKI: trustshield.pillar2.pki
      DATABASE_URL: postgresql://postgres:postgres_secure_pass@postgres:5432/trustshield?sslmode=disable
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - trustshield-backend-net
      - trustshield-isolated-egress

  # ============================================================================
  # 9. WORKER POOLS: Pillar 3 Application-Level Web Security Worker
  # ============================================================================
  worker-pillar3-websec:
    build:
      context: .
      dockerfile: workers/pillar3-websec/Dockerfile
    container_name: trustshield-worker-pillar3
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_PILLAR3_WEBSEC: trustshield.pillar3.websec
      DATABASE_URL: postgresql://postgres:postgres_secure_pass@postgres:5432/trustshield?sslmode=disable
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - trustshield-backend-net
      - trustshield-isolated-egress

  # ============================================================================
  # 10. WORKER POOLS: Pillar 4 CTI & STIX 2.1 Threat Graph Worker
  # ============================================================================
  worker-pillar4-cti:
    build:
      context: .
      dockerfile: workers/pillar4-cti/Dockerfile
    container_name: trustshield-worker-pillar4
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_PILLAR4_CTI: trustshield.pillar4.cti
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_secure_pass
      DATABASE_URL: postgresql://postgres:postgres_secure_pass@postgres:5432/trustshield?sslmode=disable
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - trustshield-backend-net
      - trustshield-isolated-egress

# ==============================================================================
# NETWORKS & VOLUMES
# ==============================================================================
networks:
  trustshield-backend-net:
    driver: bridge
    name: trustshield-backend-net
  # Isolated egress network for sandboxed scanners
  trustshield-isolated-egress:
    driver: bridge
    internal: false
    name: trustshield-isolated-egress

volumes:
  kafkadata:
    name: trustshield-kafkadata
  pgdata:
    name: trustshield-pgdata
  redisdata:
    name: trustshield-redisdata
  neo4jdata:
    name: trustshield-neo4jdata
  neo4jplugins:
    name: trustshield-neo4jplugins
  miniodata:
    name: trustshield-miniodata
