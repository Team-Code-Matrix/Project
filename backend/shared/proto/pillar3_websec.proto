syntax = "proto3";

package trustshield.pillar3;

import "common.proto";

option go_package = "github.com/trustshield/backend/shared/proto/pillar3";

message CspAudit {
  bool present = 1;
  int32 directives_count = 2;
  bool unsafe_inline = 3;
  bool unsafe_eval = 4;
  bool wildcard_origins = 5;
  string grade = 6; // "A+", "A", "B", "C", "F"
  string raw_header = 7;
}

message HstsAudit {
  bool present = 1;
  int64 max_age_seconds = 2;
  bool include_subdomains = 3;
  bool preloaded = 4;
  string grade = 5; // "EXCELLENT", "ADEQUATE", "DEFICIENT"
}

message HttpHeadersAudit {
  CspAudit csp = 1;
  HstsAudit hsts = 2;
  string x_frame_options = 3; // "DENY", "SAMEORIGIN", "ALLOW-FROM", "MISSING"
  bool x_content_type_options_nosniff = 4;
  string referrer_policy = 5;
  string permissions_policy = 6;
}

message CookieSecurityAudit {
  int32 total_cookies_count = 1;
  int32 secure_flags_missing_count = 2;
  int32 http_only_missing_count = 3;
  int32 same_site_missing_count = 4;
  bool session_cookies_safe = 5;
}

message CorsPolicyAudit {
  bool wildcard_origin = 1;
  bool origin_reflection = 2;
  bool credentials_allowed = 3;
  string verdict = 4; // "RESTRICTED", "PERMISSIVE", "VULNERABLE"
}

message TlsFingerprints {
  string negotiated_protocol = 1; // "TLS 1.3", "TLS 1.2", "TLS 1.1", "TLS 1.0", "SSLv3"
  string negotiated_cipher = 2;
  bool forward_secrecy = 3;
  bool weak_cipher_detected = 4;
  string ja3s_hash = 5;
  string ja4s_hash = 6;
  bool aitm_proxy_signature_detected = 7; // Evilginx2 detection
}

message MatchedCve {
  string cve_id = 1;
  string component = 2;
  string severity = 3; // "CRITICAL", "HIGH", "MEDIUM", "LOW"
  string summary = 4;
}

message PassiveExposure {
  string server_banner = 1;
  string x_powered_by = 2;
  repeated string exposed_files_observed = 3; // e.g. ["/.git/HEAD", "/.env"]
  repeated MatchedCve matched_cves = 4;
}

message Pillar3Telemetry {
  string scan_id = 1;
  trustshield.common.WorkerStatusState status = 2;
  int64 duration_ms = 3;
  HttpHeadersAudit http_headers = 4;
  CookieSecurityAudit cookie_security = 5;
  CorsPolicyAudit cors_policy = 6;
  TlsFingerprints tls_fingerprints = 7;
  PassiveExposure passive_exposure = 8;
  repeated trustshield.common.Finding findings = 9;
  string summary = 10;
}

